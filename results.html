<html>
<head>
<title>Theranos - Laboratory Results</title>
<meta name="viewport" content="width=device-width">
</head>
<body bgcolor="#FFFDF8" text="#000000" link="#0000EE" vlink="#551A8B">
<font face="Times New Roman">

<img src="logo.svg" alt="Theranos" width="320"><br>
<font size="2"><i>"Hundreds of tests from a single drop of blood"&trade;</i></font>
<hr>

<h1>Laboratory Results Report</h1>
<hr>

<table border="1" cellpadding="4" cellspacing="0">
<tr><td bgcolor="#EEEEEE"><b>Patient:</b></td><td id="name"></td></tr>
<tr><td bgcolor="#EEEEEE"><b>MRN:</b></td><td id="mrn"></td></tr>
<tr><td bgcolor="#EEEEEE"><b>Collected:</b></td><td id="date"></td></tr>
<tr><td bgcolor="#EEEEEE"><b>Specimen:</b></td><td>Blood, 1 drop (approx.)</td></tr>
<tr><td bgcolor="#EEEEEE"><b>Ordering Physician:</b></td><td id="doc"></td></tr>
</table>

<h2>Results</h2>
<table border="1" cellpadding="4" cellspacing="0" width="100%">
<tr bgcolor="#000080">
<th><font color="#FFFFFF">Test</font></th>
<th><font color="#FFFFFF">Result</font></th>
<th><font color="#FFFFFF">Flag</font></th>
<th><font color="#FFFFFF">Reference Range</font></th>
</tr>
<tbody id="results"></tbody>
</table>
<p><font size="2">H = High &nbsp; L = Low &nbsp; !! = Critical, please consult a physician or a bartender</font></p>


</font>

<script>
function rnd(a, b, dp) { return (a + Math.random() * (b - a)).toFixed(dp || 0); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// [name, unit, lo, hi, minValue, maxValue, decimals]  -> numeric, flagged vs lo/hi
// [name, [possible text results], normalResult]       -> text
var tests = [
  ["Cholesterol, Total", "mg/dL", 125, 200, 90, 320],
  ["Glucose, Fasting", "mg/dL", 70, 99, 55, 180],
  ["Hemoglobin", "g/dL", 12, 17.5, 9, 20, 1],
  ["White Blood Cell Count", "K/uL", 4.5, 11, 2, 18, 1],
  ["Platelets", "K/uL", 150, 400, 80, 600],
  ["Sodium", "mmol/L", 135, 145, 125, 155],
  ["Potassium", "mmol/L", 3.5, 5.1, 2.8, 6.2, 1],
  ["Vitamin D", "ng/mL", 30, 100, 5, 120],
  ["Iron", "ug/dL", 60, 170, 20, 250],
  ["Odds of Getting Drunk Tonight", "%", 0, 50, 10, 100],
  ["Caffeine", "mg/dL", 0, 4, 0, 30, 1],
  ["Hours Until Hangover", "hr", 8, 14, 2, 30],
  ["Probability of Texting Ex", "%", 0, 5, 0, 100],
  ["Blood Alcohol (Projected 2am)", "%", 0, 0.08, 0, 0.3, 2],
  ["Dance Floor Endurance", "songs", 4, 12, 0, 40],
  ["Midichlorian Count", "per cell", 2500, 7000, 1000, 25000],
  ["Blood Type", ["O+", "A+", "B-", "AB+", "Fruit Punch", "Unknown (insufficient sample)", "Type 2 Monster Energy"], null],
  ["Zodiac Compatibility", ["Normal", "Gemini (concerning)", "Mercury in Retrograde", "Inconclusive"], "Normal"],
  ["Ghost Detected in Sample", ["None", "Trace", "Friendly", "Present - Do Not Turn Around"], "None"],
];


var name = new URLSearchParams(location.search).get("name") || "DOE, JOHN";
document.getElementById("name").textContent = name.toUpperCase();
document.getElementById("mrn").textContent = rnd(10000000, 99999999);
document.getElementById("date").textContent = new Date().toLocaleString();
document.getElementById("doc").textContent = pick(["Dr. Sunny Balwani", "Dr. Frank N. Stein", "Dr. Acula", "Dr. Pepper", "Dr. Nick Riviera"]);

var chosen = tests.sort(function () { return Math.random() - 0.5; }).slice(0, 14);
var rows = "";
chosen.forEach(function (t) {
  var result, flag = "", range;
  if (Array.isArray(t[1])) {
    result = pick(t[1]);
    range = t[2] || "&mdash;";
    if (t[2] && result !== t[2]) flag = "!!";
  } else {
    var v = parseFloat(rnd(t[4], t[5], t[6]));
    result = v + " " + t[1];
    range = t[2] + " - " + t[3];
    if (v > t[3]) flag = "H";
    if (v < t[2]) flag = "L";
  }
  var color = flag ? "#CC0000" : "#000000";
  rows += "<tr><td>" + t[0] + "</td><td><font color='" + color + "'><b>" + result +
          "</b></font></td><td align='center'><font color='#CC0000'><b>" + flag +
          "</b></font></td><td>" + range + "</td></tr>";
});
document.getElementById("results").innerHTML = rows;
</script>
</body>
</html>
